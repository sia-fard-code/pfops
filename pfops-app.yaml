apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap-pfops-prj
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  description: pfops project
  destinations:
  - namespace: '*'
    server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  sourceRepos:
  - '*'
  
---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'bootstrap-pfops'
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: bootstrap-pfops-prj
  source:
    path: bootstrap-src
    repoURL: git@github.com:sia-fard-code/pfops.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
