#@ load("@ytt:data", "data")
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: #@ data.values.env.cluster + '-pfops-wf'
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - watch
  - patch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
- apiGroups:
  - argoproj.io
  resources:
  - workflowtaskresults
  verbs:
  - create
- apiGroups:
  - argoproj.io
  resources:
  - workflowtasksets
  verbs:
  - list
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - workflowtasksets/status
  - workflowtasksets
  verbs:
  - patch


---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: #@ data.values.env.cluster + '-pfops-wf'
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: true

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: #@ data.values.env.cluster + '-pfops-wf'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: #@ data.values.env.cluster + "-pfops-wf"
subjects:
- kind: ServiceAccount
  name: #@ data.values.env.cluster + "-pfops-wf"
  namespace: #@ data.values.env.cluster + "-" + data.values.env.pfops.env