#@ load("@ytt:data", "data")
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: #@ data.values.env.cluster + '-pfops-es'
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: #@ data.values.env.cluster + '-pfops-es'
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: true

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: #@ data.values.env.cluster + '-pfops-es'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: #@ data.values.env.cluster + "-pfops-es"
subjects:
- kind: ServiceAccount
  name: #@ data.values.env.cluster + "-pfops-es"
  namespace: #@ data.values.env.cluster + "-" + data.values.env.pfops.env