---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: #@ es.sync_wave
    #@ if/end hook != "Sync":
    argocd.argoproj.io/hook: #@ hook
  #@ if/end hasattr(es,"labels"):
  labels: #@ es.labels
  name: #@ es.name
  #@ if data.values.app.override_na == "true":
    #@ namespace = es.ns
  #@ elif data.values.app.default_ns == "true":
    #@ namespace = data.values.app.cluster + "-" + data.values.app.env
  #@ else :
    #@ namespace = data.values.app.cluster + "-" + data.values.app.env + "-" + es.ns
  #@ end
  namespace: #@ namespace
spec:
  data: #@ es.data
  refreshInterval: #@ es.refreshInterval
  secretStoreRef: #@ es.secretStoreRef
  target: #@ es.target
      #@ end
    #@ end
  #@ end
#@ end
