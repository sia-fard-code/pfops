apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: 'argocd-cli'
rules:
- apiGroups:
  - argoproj.io
  resources:
  - applications
  - applicationsets
  - appprojects
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list
- apiGroups:
  - ""
  resources:
  - pods/portforward
  verbs:
  - create

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: 'argocd-cli'
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: true

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: 'argocd-cli'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: 'argocd-cli'
subjects:
- kind: ServiceAccount
  name: 'argocd-cli'
  namespace: argocd

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: 'argocd-cli'
  namespace: argocd
data:
  config: |-
    contexts:
    - name: kubernetes
      server: kubernetes
      user: kubernetes
    current-context: kubernetes
    servers:
    - core: true
      grpc-web-root-path: ""
      server: kubernetes
    users:
    - name: kubernetes

---
