apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'clusters'
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: platform
  source:
    path: bootstrap
    repoURL: ssh://git@bitbucket.corp.zscaler.com:7999/tools/pfops-manifests.git
    targetRevision: feature/TOOLS-480-automating-argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true