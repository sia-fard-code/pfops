apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'clusters'
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: platform
  source:
    path: bootstrap
    repoURL: git@github.com:sia-fard-code/demo-manifests.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true