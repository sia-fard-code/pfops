apiVersion: batch/v1
kind: Job
metadata:
  name: 'pfops-deploy-manual-trigger'
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: 'PostSync'
    # argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-options: Replace=true
spec:
  template:
    spec:
      containers:
      - name: 'pfops-deploy-manual-trigger'
        image: siavashghf2000/pfops
        args:
          - '-c'
          - /root/script/script.sh
        command:
          - /bin/sh
        env:
        - name: GIT_SSH_COMMAND
          value: "ssh -i /root/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes"
        volumeMounts:
          - mountPath: /root/.ssh
            name: ssh
          - mountPath: /root/script
            name: script
      volumes:
        - secret:
            secretName: argocd-repo-creds-ssh-creds
            items:
              - key: sshPrivateKey
                mode: 0400 
                path: id_rsa        
          name: ssh
        - configMap:
            name: pfops-deploy-scripts
            defaultMode: 0744
          name: script
      serviceAccount: bootstrap-pfops
      serviceAccountName: bootstrap-pfops
      imagePullSecrets: 
      - name: regcred
      restartPolicy: Never
  backoffLimit: 2
