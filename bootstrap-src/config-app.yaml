apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 'pfops-config-set'
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: git@github.com:sia-fard-code/pfops-config.git
        revision: main
        directories:
        - path: "*"
  template:
    metadata:
      name: '{{path.basename}}-config-files'
      namespace: argocd
    spec:
      destination:
        namespace: argocd
        server: https://kubernetes.default.svc
      project: bootstrap-pfops-prj
      source:
        plugin: 
          name: yq
        path: '{{path.basename}}'
        repoURL: git@github.com:sia-fard-code/pfops-config.git
        targetRevision: main
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: 'bootstrap-pfops'
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: 'bootstrap-pfops'
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: true

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: 'bootstrap-pfops'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: 'bootstrap-pfops'
subjects:
- kind: ServiceAccount
  name: 'bootstrap-pfops'
  namespace: argocd

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: 'pfops-deploy-scripts'
  namespace: argocd
data:
  script.sh: |
    #! /bin/sh
    set -e
    git config --global user.email "sghalamifard@zscaker.com"
    git config --global user.name "Siavash"
    cd /workspace/
    git clone -b main --single-branch git@github.com:sia-fard-code/demo-manifests.git
    git clone -b main --single-branch git@github.com:sia-fard-code/demo-metadata.git
    
    mkdir -p /var/tmp/cms
    for cm in $(kubectl get cm --all-namespaces -l manual=true,prefix=apps --no-headers -o custom-columns="NS:metadata.namespace,Name:metadata.name" | sed 's#\s\(.*\)\s#,#g' ); do
        name=$(echo "$cm" | cut -f2 -d,)
        ns=$(echo "$cm" | cut -f1 -d,)
        kubectl get cm -n $ns $name -o jsonpath="{.data['config\.yaml']}" > /var/tmp/cms/$name
        ./entrypoint.sh /var/tmp/cms/$name false
    done

    for cm in $(kubectl get cm --all-namespaces -l manual=true,prefix=bootstrap --no-headers -o custom-columns="NS:metadata.namespace,Name:metadata.name" | sed 's#\s\(.*\)\s#,#g'); do
        name=$(echo "$cm" | cut -f2 -d,)
        ns=$(echo "$cm" |  cut -f1 -d,)
        kubectl get cm -n $ns $name -o jsonpath="{.data['config\.yaml']}" > /var/tmp/cms/$name
        ./entrypoint.sh /var/tmp/cms/$name true
    done

    cp -fr /workspace/manifests/* /workspace/demo-manifests
    cp -fr /workspace/metadata/* /workspace/demo-metadata

    cd /workspace/demo-manifests
    git add -A
    git diff-index --quiet HEAD || git commit -am "TOOLS-741 merged files"
    git push

    cd /workspace/demo-metadata
    git add -A
    git diff-index --quiet HEAD || git commit -am "TOOLS-741 merged files"
    git push
---

